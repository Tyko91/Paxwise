<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paxwise</title>
<style>
:root{--navy:#1B365D;--ok:#1e7a3a;--bad:#9c0006}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#f3f5f8;color:#1b1b1b}
header{background:var(--navy);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
main{padding:12px 12px 90px;max-width:720px;margin:0 auto}
section{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
h2,summary.h{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);font-weight:700}
label{font-size:11px;color:#5d6d7e;display:block}
input,select{width:100%;padding:8px;border:1px solid #d5dce4;border-radius:8px;font-size:16px}
input.yellow{background:#FFF3A0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kist,.typekaart{border:1px solid #e5eaf0;border-radius:10px;padding:10px;margin-top:8px;background:#fafbfd}
.kist h3,.typekaart h3{margin:0 0 8px;font-size:14px}
.rest{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pill{border-radius:10px;padding:10px 8px;text-align:center}
.pill b{display:block;font-size:18px}
.pill span{font-size:11px;color:#5d6d7e}
.zero{background:#d5f5e3}.left{background:#fff3a0}.over{background:#ffc7ce}
.advies{font-size:13px;line-height:1.45}
.advies div{padding:6px 0;border-bottom:1px solid #eef2f6}
button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;margin-top:8px}
button.sec{background:#2c5282}button.ghost{background:#e8eef5;color:#1B365D}
.tiny{font-size:11px;color:#5d6d7e;margin-top:6px}
.past.ok{color:var(--ok);font-weight:700}.past.bad{color:var(--bad);font-weight:700}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chk label{display:flex;align-items:center;gap:6px;background:#f4f6f8;padding:8px 10px;border-radius:8px;font-size:13px;color:#1b365d}
.chk input{width:auto}
.chk label.off{opacity:.4;text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;width:auto;padding:8px 12px;border-radius:999px;background:#e8eef5;color:#1B365D;font-size:13px;margin:0}
.chip.on{background:var(--navy);color:#fff}
.plan{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin:0 0 8px;font-size:14px;font-weight:700;width:100%;border:0;text-align:left}
.plan.on{background:#d5f5e3;color:#1e7a3a}
.plan.off{background:#ffc7ce;color:#9c0006}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:0 0 10px}
.plan .flybox{width:20px;height:20px}
details{margin-top:6px}
</style>
</head>
<body>
<header><h1>Paxwise</h1></header>
<main>
<section>
<h2>Mijn routes</h2>
<div class="chips" id="chips"></div>
<div class="grid2">
<button type="button" class="ghost" onclick="newRoute()">+ nieuwe route</button>
<button type="button" class="sec" onclick="saveRoute()">Deze route opslaan</button>
</div>
</section>
<section>
<h2>Heen en terug — typ IATA</h2>
<div class="grid2">
<div><label>Heen</label><input class="yellow" id="fromA" maxlength="3" value="VIE" autocapitalize="characters"></div>
<div><label>Terug</label><input class="yellow" id="toA" maxlength="3" value="GRU" autocapitalize="characters"></div>
</div>
<p class="tiny" id="iataHint"></p>
<div class="grid2" style="margin-top:8px">
<div><label>Route</label><input class="yellow" id="route" value="VIE–GRU"></div>
<div><label>Afstand km (spel)</label><input class="yellow" id="km" type="number" value="10621"></div>
</div>
</section>
<section>
<details>
<summary class="h">Toestellen toevoegen / wijzigen</summary>
<div id="types"></div>
<div class="typekaart">
<h3>Nieuw type</h3>
<div class="grid2">
<div><label>Naam</label><input id="nName" placeholder="bijv. 787-9"></div>
<div><label>Max pax</label><input id="nPax" type="number"></div>
</div>
<div class="grid4" style="margin-top:8px">
<div><label>Payload t</label><input id="nPay" type="number"></div>
<div><label>km/h</label><input id="nSpd" type="number"></div>
<div><label>Max km</label><input id="nRng" type="number"></div>
</div>
<button type="button" class="sec" onclick="addCustomType()">Voeg toestel toe</button>
</div>
</details>
</section>
<section>
<h2>Vraag uit het routescherm</h2>
<div class="grid4">
<div><label>Y</label><input class="yellow" id="qY" type="number" value="1788"></div>
<div><label>J</label><input class="yellow" id="qJ" type="number" value="300"></div>
<div><label>F</label><input class="yellow" id="qF" type="number" value="96"></div>
<div><label>Cargo t</label><input class="yellow" id="qC" type="number" step="0.1" value="21"></div>
</div>
<input id="factor" type="hidden" value="2">
<input id="jkost" type="hidden" value="1.8">
<input id="fkost" type="hidden" value="4.2">
</section>
<section>
<h2>Nog over — live</h2>
<div class="rest" id="rest"></div>
</section>
<section>
<h2>Inzetten + suggestie</h2>
<div class="chk" id="kiezen"></div>
<button type="button" onclick="suggest(false)">Stel mix voor</button>
<button type="button" class="sec" onclick="suggest(true)">Alleen de rest bijvullen</button>
<button type="button" class="ghost" onclick="clearFleet()">Wis vloot</button>
</section>
<section>
<h2>Vloot</h2>
<div id="vloot"></div>
<button type="button" class="sec" onclick="addKist()">+ lege kist</button>
</section>
<section>
<h2>Waarom</h2>
<div class="advies" id="advies"></div>
</section>
</main>
<script>
const HUBS={VIE:[48.1103,16.5697],GRU:[-23.4319,-46.4678],GIG:[-22.8099,-43.2506],BSB:[-15.8711,-47.9186],AMS:[52.3086,4.7639],FRA:[50.0333,8.5706],MUC:[48.3538,11.7861],DUS:[51.2895,6.7668],HAM:[53.6304,9.9882],BER:[52.3667,13.5033],LHR:[51.47,-0.4543],LGW:[51.1537,-0.1821],MAN:[53.3537,-2.275],CDG:[49.0097,2.5478],ORY:[48.7233,2.3794],MAD:[40.4983,-3.5676],BCN:[41.2971,2.0785],FCO:[41.8003,12.2389],MXP:[45.6306,8.7281],ZRH:[47.4581,8.5481],GVA:[46.2381,6.1089],BRU:[50.9014,4.4844],DUB:[53.4213,-6.2701],CPH:[55.618,12.656],ARN:[59.6519,17.9186],OSL:[60.1939,11.1004],HEL:[60.3172,24.9633],WAW:[52.1658,20.9671],PRG:[50.1008,14.26],BUD:[47.4298,19.2611],ATH:[37.9364,23.9445],IST:[41.2753,28.7519],LIS:[38.7742,-9.1342],DXB:[25.2532,55.3657],DOH:[25.2731,51.6081],AUH:[24.433,54.6511],CAI:[30.1219,31.4056],JNB:[-26.1392,28.246],CPT:[-33.9648,18.6017],JFK:[40.6398,-73.7789],EWR:[40.6925,-74.1687],ORD:[41.9786,-87.9048],ATL:[33.6367,-84.4281],MIA:[25.7959,-80.287],DFW:[32.8968,-97.038],LAX:[33.9425,-118.408],SFO:[37.6189,-122.375],YYZ:[43.6772,-79.6306],MEX:[19.4363,-99.0721],EZE:[-34.8222,-58.5358],SCL:[-33.393,-70.7858],BOG:[4.7016,-74.1469],LIM:[-12.0219,-77.1143],NRT:[35.7647,140.386],HND:[35.5523,139.78],ICN:[37.4691,126.451],PEK:[40.0801,116.585],PVG:[31.1434,121.805],HKG:[22.308,113.919],SIN:[1.3502,103.994],BKK:[13.6811,100.747],DEL:[28.5562,77.1],BOM:[19.0887,72.8679],SYD:[-33.9461,151.177],MEL:[-37.6733,144.843],AKL:[-37.0082,174.792]};

const KEY="am_routes_v1", TKEY="am_types_v1";
let TYPE_ORDER=["A350-1000LR","A330-300","A320neo"];
let TYPE_DEFAULTS={
"A350-1000LR":{pax:480,payload:55,speed:950,range:18000},
"A330-300":{pax:440,payload:46,speed:871,range:11750},
"A320neo":{pax:195,payload:20,speed:893,range:6482}
};
let lastWhy=[], currentId=null;
function num(id){return parseFloat(document.getElementById(id).value)||0}
function nval(el){return parseFloat(el&&el.value)||0}
function sid(t,k){return k+"_"+t.replace(/[^A-Za-z0-9]/g,"")}
function code(id){return (document.getElementById(id).value||"").trim().toUpperCase()}
function loadTypes(){try{const s=JSON.parse(localStorage.getItem(TKEY)||"null");if(s&&s.order&&s.defs){TYPE_ORDER=s.order;TYPE_DEFAULTS=s.defs}}catch(e){}}
function saveTypes(){try{localStorage.setItem(TKEY,JSON.stringify({order:TYPE_ORDER,defs:TYPE_DEFAULTS}))}catch(e){}}
function gcdKm(a,b){const R=6371,to=d=>d*Math.PI/180,dlat=to(b[0]-a[0]),dlon=to(b[1]-a[1]),x=Math.sin(dlat/2)**2+Math.cos(to(a[0]))*Math.cos(to(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}
function applyIata(fillKm){
  const a=code("fromA"),b=code("toA");
  if(a.length===3&&b.length===3) document.getElementById("route").value=a+"–"+b;
  const ha=HUBS[a],hb=HUBS[b],hint=document.getElementById("iataHint");
  if(ha&&hb){const km=Math.round(gcdKm(ha,hb)); if(fillKm) document.getElementById("km").value=km; hint.textContent="IATA "+a+"↔"+b+" ≈ "+km+" km. Zet Playrion-km in het gele veld.";}
  else hint.textContent="Onbekende code: typ de km uit het spel.";
  calc();
}
function typeSpec(t){const d=TYPE_DEFAULTS[t]||{pax:0,payload:0,speed:0,range:0};return{pax:nval(document.getElementById(sid(t,"pax")))||d.pax,payload:nval(document.getElementById(sid(t,"payload")))||d.payload,speed:nval(document.getElementById(sid(t,"speed")))||d.speed,range:nval(document.getElementById(sid(t,"range")))||d.range}}
function rawVl(t){const km=num("km"),s=typeSpec(t).speed;return(!km||!s)?0:12*s/km}
function canFly(t){return num("km")>0&&typeSpec(t).range+0.5>=num("km")}
function planVl(t){if(!canFly(t))return 0;const raw=rawVl(t);if(raw<0.45)return 0;if(raw<1)return 1;return Math.floor(raw)}
function blokU(t){const km=num("km"),s=typeSpec(t).speed;return(!km||!s)?0:km/s}
function selectedTypes(){return TYPE_ORDER.filter(t=>{const el=document.getElementById("use_"+t);return el&&el.checked&&!el.disabled&&canFly(t)&&planVl(t)>0}).sort((a,b)=>typeSpec(b).pax-typeSpec(a).pax)}
function packOne(need,typeName,jkost,fkost){
  const t=typeSpec(typeName),fl=planVl(typeName);if(!fl)return null;
  let space=t.pax;const y=Math.min(Math.max(0,Math.ceil(need.Y/fl)),space);space-=y;
  const j=Math.min(Math.max(0,Math.ceil(need.J/fl)),Math.floor(space/jkost));space-=j*jkost;
  const f=Math.min(Math.max(0,Math.ceil(need.F/fl)),Math.floor(space/fkost));
  const c=Math.min(Math.max(0,need.C/fl),t.payload);
  if(y+j+f+c<=0)return null;
  return{type:typeName,fl:String(fl),y:String(y),j:String(j),f:String(f),c:String(Math.round(c*10)/10),on:true};
}
function plek(need,jk,fk){return Math.max(0,need.Y)+Math.max(0,need.J)*jk+Math.max(0,need.F)*fk}
function pickType(need,types,jk,fk){
  const large=types[0], small=types[types.length-1];
  const p=plek(need,jk,fk);
  if(types.length===1) return large;
  if(need.F<0.5 && need.J<1 && p<=typeSpec(small).pax) return small;
  if(need.F*fk+need.J*jk > typeSpec(small).pax*0.55) return large;
  if(p<=typeSpec(small).pax) return small;
  const mid=types.find(t=>t!==large && t!==small) || small;
  if(p<=typeSpec(mid).pax) return mid;
  return large;
}
function packNeed(need,types,jkost,fkost){
  const planes=[],why=[];need={...need};let guard=0;
  while((need.Y>0.5||need.J>0.5||need.F>0.5||need.C>0.05)&&guard++<16){
    const chosen=pickType(need,types,jkost,fkost);
    const p=packOne(need,chosen,jkost,fkost);if(!p)break;const fl=+p.fl;
    planes.push(p);need.Y-=+p.y*fl;need.J-=+p.j*fl;need.F-=+p.f*fl;need.C-=+p.c*fl;
    why.push(planes.length+". "+p.type+" · "+p.fl+"×/dag · "+p.y+"Y / "+p.j+"J / "+p.f+"F / "+p.c+"t");
  }
  if(need.Y>0.5||need.J>0.5||need.F>0.5) why.push("Nog open: "+Math.ceil(need.Y)+"Y / "+Math.ceil(need.J)+"J / "+Math.ceil(need.F)+"F.");
  return{planes,why};
}
function currentRows(){return [...document.querySelectorAll(".kist")].map(k=>({type:k.querySelector(".type").value,fl:k.querySelector(".fl").value,y:k.querySelector(".y").value,j:k.querySelector(".j").value,f:k.querySelector(".f").value,c:k.querySelector(".c").value,on:k.querySelector(".flybox")?k.querySelector(".flybox").checked:true}))}
function writeRows(rows){const box=document.getElementById("vloot");box.innerHTML="";rows.forEach((r,i)=>box.appendChild(kistEl(i+1,r)));calc()}
function kistEl(i,r){
  const d=document.createElement("div");d.className="kist";
  const opts=["<option value=''>— leeg —</option>"].concat(TYPE_ORDER.map(tn=>"<option "+(tn===r.type?"selected":"")+">"+tn+"</option>")).join("");
  const on=r.on!==false;
  const fl=r.type&&canFly(r.type)?String(planVl(r.type)):(r.fl||"1");
  d.innerHTML="<h3>Kist "+i+"</h3><label class='plan "+(on?"on":"off")+"'><input class='flybox' type='checkbox' "+(on?"checked":"")+"><span class='dot'></span><span class='planlab'>"+(on?"Ingepland in game":"Niet ingepland")+"</span></label><input class='fl' type='hidden' value='"+fl+"'><div><label>Type</label><select class='type'>"+opts+"</select></div><div class='grid4' style='margin-top:8px'><div><label>Y</label><input class='y yellow' type='number' value='"+(r.y||"")+"'></div><div><label>J</label><input class='j yellow' type='number' value='"+(r.j||"")+"'></div><div><label>F</label><input class='f yellow' type='number' value='"+(r.f||"")+"'></div><div><label>Cargo t</label><input class='c yellow' type='number' step='0.1' value='"+(r.c||"")+"'></div></div><p class='tiny' id='info"+i+"'></p><button type='button' class='ghost' onclick='dropKist("+i+")'>Verwijder uit vloot</button>";
  const box=d.querySelector(".plan"), lab=d.querySelector(".planlab"), cb=d.querySelector(".flybox");
  function paint(){const v=cb.checked;box.className="plan "+(v?"on":"off");lab.textContent=v?"Ingepland in game":"Niet ingepland";calc()}
  cb.addEventListener("change",paint);
  d.querySelectorAll("input.y,input.j,input.f,input.c,select").forEach(el=>el.addEventListener("input",calc));
  d.querySelector(".type").addEventListener("change",()=>{const tp=d.querySelector(".type").value;if(tp&&canFly(tp))d.querySelector(".fl").value=planVl(tp);calc()});
  return d;
}
function addKist(){writeRows(currentRows().concat([{type:"",fl:"1",y:"",j:"",f:"",c:"",on:true}]))}
function dropKist(i){const rows=currentRows();rows.splice(i-1,1);writeRows(rows.length?rows:[{type:"",fl:"1",y:"",j:"",f:"",c:"",on:true}])}
function clearFleet(){lastWhy=["Vloot gewist."];writeRows([{type:"",fl:"1",y:"",j:"",f:"",c:"",on:true}])}
function suggest(onlyRest){
  refreshKiezen();
  const types=selectedTypes();if(!types.length){lastWhy=["Geen type dat deze afstand aankan."];calc();return}
  const fac=num("factor")||2,jkost=num("jkost")||1.8,fkost=num("fkost")||4.2;
  let need={Y:num("qY")/fac,J:num("qJ")/fac,F:num("qF")/fac,C:num("qC")/fac},keep=[];
  if(onlyRest){keep=currentRows().filter(r=>r.type&&r.on!==false);keep.forEach(r=>{const fl=parseFloat(r.fl)||1;need.Y-=(parseFloat(r.y)||0)*fl;need.J-=(parseFloat(r.j)||0)*fl;need.F-=(parseFloat(r.f)||0)*fl;need.C-=(parseFloat(r.c)||0)*fl})}
  const packed=packNeed(need,types,jkost,fkost);
  lastWhy=[document.getElementById("route").value+" · "+num("km")+" km","Mix: "+types.join(" + ")].concat(packed.why);
  writeRows(keep.concat(packed.planes));saveRoute();
}
function snapshot(){return{id:currentId||("r"+Date.now()),route:document.getElementById("route").value,from:code("fromA"),to:code("toA"),km:num("km"),qY:num("qY"),qJ:num("qJ"),qF:num("qF"),qC:num("qC"),fleet:currentRows()}}
function loadList(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function storeList(list){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
function renderChips(){const list=loadList();document.getElementById("chips").innerHTML=list.length?list.map(r=>"<button type='button' class='chip "+(r.id===currentId?"on":"")+"' onclick=\"openRoute('"+r.id+"')\">"+(r.route||r.id)+"</button>").join(""):"<span class='tiny'>Nog geen opgeslagen routes.</span>"}
function saveRoute(){const s=snapshot();currentId=s.id;const list=loadList();const i=list.findIndex(r=>r.id===s.id);if(i>=0)list[i]=s;else list.push(s);storeList(list);renderChips()}
function openRoute(id){const r=loadList().find(x=>x.id===id);if(!r)return;currentId=r.id;document.getElementById("fromA").value=r.from||"";document.getElementById("toA").value=r.to||"";document.getElementById("route").value=r.route||"";document.getElementById("km").value=r.km||"";document.getElementById("qY").value=r.qY??"";document.getElementById("qJ").value=r.qJ??"";document.getElementById("qF").value=r.qF??"";document.getElementById("qC").value=r.qC??"";writeRows(r.fleet&&r.fleet.length?r.fleet:[{type:"",fl:"1",y:"",j:"",f:"",c:"",on:true}]);applyIata(false);renderChips()}
function newRoute(){saveRoute();currentId="r"+Date.now();["fromA","toA","route","km","qY","qJ","qF","qC"].forEach(id=>document.getElementById(id).value="");lastWhy=[];writeRows([{type:"",fl:"1",y:"",j:"",f:"",c:"",on:true}]);renderChips()}
function renderTypes(){
  document.getElementById("types").innerHTML=TYPE_ORDER.map(t=>{const d=TYPE_DEFAULTS[t];return "<div class='typekaart'><h3>"+t+"</h3><div class='grid4'><div><label>Max pax</label><input class='yellow' id='"+sid(t,"pax")+"' type='number' value='"+d.pax+"'></div><div><label>Payload t</label><input class='yellow' id='"+sid(t,"payload")+"' type='number' value='"+d.payload+"'></div><div><label>km/h</label><input class='yellow' id='"+sid(t,"speed")+"' type='number' value='"+d.speed+"'></div><div><label>Max km</label><input class='yellow' id='"+sid(t,"range")+"' type='number' value='"+d.range+"'></div></div><p class='tiny' id='"+sid(t,"stat")+"'></p></div>"}).join("");
  renderKiezen();
}
function renderKiezen(){
  document.getElementById("kiezen").innerHTML=TYPE_ORDER.map(t=>{
    const ok=canFly(t);
    return "<label class='"+(ok?"":"off")+"'><input type='checkbox' id='use_"+t+"' "+(ok?"checked":"disabled")+"> "+t+(ok?"":" · te ver")+"</label>";
  }).join("");
}
function refreshKiezen(){
  TYPE_ORDER.forEach(t=>{
    const el=document.getElementById("use_"+t); if(!el) return;
    const lab=el.parentElement;
    if(!canFly(t)){el.checked=false;el.disabled=true;if(lab)lab.classList.add("off")}
    else{el.disabled=false;if(lab)lab.classList.remove("off")}
  });
}
function addCustomType(){
  const n=(document.getElementById("nName").value||"").trim();
  const pax=+document.getElementById("nPax").value, pay=+document.getElementById("nPay").value, spd=+document.getElementById("nSpd").value, rng=+document.getElementById("nRng").value;
  if(!n||!pax||!spd||!rng){alert("Naam, pax, km/h en max km invullen.");return}
  TYPE_DEFAULTS[n]={pax:pax,payload:pay||0,speed:spd,range:rng};
  if(!TYPE_ORDER.includes(n)) TYPE_ORDER.push(n);
  saveTypes();renderTypes();calc();
}
function pill(label,val,kind){return "<div class='pill "+kind+"'><span>"+label+"</span><b>"+val+"</b></div>"}
function calc(){
  refreshKiezen();
  TYPE_ORDER.forEach(t=>{const el=document.getElementById(sid(t,"stat"));if(!el)return;el.textContent=canFly(t)?("Blok heen "+blokU(t).toFixed(1)+" u · "+planVl(t)+"×/dag"):("TE VER voor "+num("km")+" km")});
  const fac=num("factor")||2,jkost=num("jkost")||1.8,fkost=num("fkost")||4.2;let weg={Y:0,J:0,F:0,C:0};
  document.querySelectorAll(".kist").forEach((k,idx)=>{
    const type=k.querySelector(".type").value,y=nval(k.querySelector(".y")),j=nval(k.querySelector(".j")),f=nval(k.querySelector(".f")),c=nval(k.querySelector(".c"));
    const fl=type&&canFly(type)?planVl(type):(nval(k.querySelector(".fl"))||1);
    if(k.querySelector(".fl")) k.querySelector(".fl").value=fl;
    const info=k.querySelector("#info"+(idx+1));
    const vliegt=k.querySelector(".flybox")?k.querySelector(".flybox").checked:true;
    if(!type){if(info)info.textContent="";return}
    if(!vliegt){if(info)info.textContent="";return}
    const t=typeSpec(type),ruimte=y+j*jkost+f*fkost;
    let msg="ruimte "+ruimte.toFixed(1)+"/"+t.pax;
    if(!canFly(type)) msg="TE VER";
    else if(ruimte>t.pax+0.05||c>t.payload+0.05) msg="TE VOL · "+msg;
    if(info)info.textContent=msg;
    weg.Y+=y*fl*fac;weg.J+=j*fl*fac;weg.F+=f*fl*fac;weg.C+=c*fl*fac;
  });
  const over={Y:num("qY")-weg.Y,J:num("qJ")-weg.J,F:num("qF")-weg.F,C:num("qC")-weg.C};
  const kind=v=>v>0.5?"left":(v<-0.5?"over":"zero");
  document.getElementById("rest").innerHTML=pill("Nog Y",over.Y.toFixed(0),kind(over.Y))+pill("Nog J",over.J.toFixed(0),kind(over.J))+pill("Nog F",over.F.toFixed(0),kind(over.F))+pill("Nog cargo t",over.C.toFixed(1),kind(over.C));
  document.getElementById("advies").innerHTML=lastWhy.concat(TYPE_ORDER.map(t=>canFly(t)?(t+": "+planVl(t)+"×/dag"):(t+": te ver"))).map(t=>"<div>"+t+"</div>").join("");
}
try{
loadTypes();
renderTypes();
["fromA","toA"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("input",()=>{el.value=el.value.toUpperCase();applyIata(true)})});
document.getElementById("km").addEventListener("input",calc);
document.querySelectorAll("input").forEach(el=>el.addEventListener("input",calc));
writeRows([{type:"A350-1000LR",fl:"1",y:"480",j:"0",f:"0",c:"0",on:true}]);
currentId="r-vie-gru";
try{saveRoute()}catch(e){}
applyIata(false);
}catch(e){document.getElementById("advies").textContent="Fout: "+e.message}
</script>
