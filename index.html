<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paxwise</title>
<style>
:root{
  --navy:#0B1F3A;
  --navy-mid:#143056;
  --gold:#C9A227;
  --gold-soft:#F7E7B5;
  --ink:#0f172a;
  --muted:#64748b;
  --bg:#e8eef6;
  --card:#fff;
  --line:#e2e8f0;
  --ok:#0f7a3f;
  --bad:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:
  radial-gradient(1200px 500px at 10% -10%,rgba(201,162,39,.18),transparent 55%),
  radial-gradient(900px 400px at 100% 0%,rgba(20,48,86,.12),transparent 50%),
  var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 60%,#1a3d6d 100%);color:#fff;padding:18px 18px 16px;border-bottom:3px solid var(--gold);box-shadow:0 8px 24px rgba(11,31,58,.25)}
header h1{margin:0;font-size:22px;font-weight:750;letter-spacing:.02em}
header h1::after{content:" · vlootplanning";font-weight:500;font-size:13px;color:var(--gold-soft);letter-spacing:.04em}
main{padding:16px 14px 100px;max-width:760px;margin:0 auto}
section{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid rgba(11,31,58,.06);box-shadow:0 10px 30px rgba(11,31,58,.06)}
h2,summary.h{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:800}
summary.h{cursor:pointer;list-style:none}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;letter-spacing:.02em}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.22)}
input.yellow{background:linear-gradient(180deg,#FFF8DC,#F7E7B5);border-color:#e6d392}
.withunit{position:relative}
.withunit input{padding-right:1.6em}
.withunit .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;font-weight:600}
input:disabled,select:disabled{background:#f8fafc;opacity:1;color:var(--ink);border-color:#eef2f7}
.lock{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:var(--navy);font-weight:600}
.lock input{width:auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ask4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kist,.typekaart{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:linear-gradient(180deg,#fff,#f8fafc)}
.kist{position:relative;padding-left:16px}
.kist::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:4px;background:var(--kist-color,var(--gold))}
.kist h3,.typekaart h3{margin:0 0 8px;font-size:15px;color:var(--navy);font-weight:750}
.roost-legend .hrs{opacity:.75;font-weight:600;margin-left:2px}
.roost-empty-tip{font-size:12px;color:rgba(247,231,181,.9);padding:8px 4px 10px;line-height:1.45;font-weight:650}
.roost-track.ghost{opacity:.35}
.roost-note.warnish{color:var(--bad);font-weight:700}
.info-ok{color:var(--muted)}
.info-bad{color:var(--bad);font-weight:700}
.rest{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pill{border-radius:12px;padding:10px 6px 12px;text-align:center;border:2px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:92px;box-sizing:border-box}
.pill .pill-lab{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;min-height:24px;display:flex;align-items:flex-end;justify-content:center}
.pill .pill-st{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.2;min-height:16px;margin-top:2px;opacity:.9}
.pill b{display:block;font-size:20px;font-weight:800;margin-top:auto;padding-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.pill.zero{background:#ecfdf3;border-color:#16a34a;color:#14532d}
.pill.zero .pill-lab,.pill.zero .pill-st{color:#15803d}
.pill.zero b{color:#14532d}
.pill.left{background:#fff7ed;border-color:#ea580c;color:#9a3412;box-shadow:inset 0 0 0 1px rgba(234,88,12,.15)}
.pill.left .pill-lab,.pill.left .pill-st{color:#c2410c}
.pill.left b{color:#9a3412}
.pill.over{background:#fff1f2;border-color:#e11d48;color:#9f1239;box-shadow:inset 0 0 0 1px rgba(225,29,72,.12)}
.pill.over .pill-lab,.pill.over .pill-st{color:#be123c}
.pill.over b{color:#9f1239}
.advies{font-size:13px;line-height:1.5;color:#334155}
.advies div{padding:8px 0;border-bottom:1px solid var(--line)}
.advies div:last-child{border-bottom:0}
button{width:100%;padding:12px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;font-size:15px;font-weight:700;margin-top:8px;box-shadow:0 8px 18px rgba(11,31,58,.2);letter-spacing:.01em}
button:active{transform:translateY(1px)}
button.sec{background:linear-gradient(135deg,#1a3d6d,#25507f);box-shadow:0 6px 14px rgba(11,31,58,.15)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{border-color:var(--gold);color:var(--navy)}
button.ok{background:#ecfdf3;color:var(--ok);border:1px solid #86efac;box-shadow:none}
button.ok:hover{border-color:var(--ok);background:#dcfce7}
button.danger{background:#fef2f2;color:var(--bad);border:1px solid #fecaca;box-shadow:none}
button.danger:hover{border-color:var(--bad);background:#fee2e2}
button:disabled{opacity:.5}
.tiny{font-size:11px;color:var(--muted);margin-top:6px}
.autosave{font-size:11px;color:var(--muted);margin:6px 0 0;font-weight:600}
.warn{color:var(--bad);font-weight:700;font-size:12px;margin-top:8px;padding:8px 10px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px}
.warn::before{content:"Let op · ";font-weight:800}
.past.ok{color:var(--ok);font-weight:700}.past.bad{color:var(--bad);font-weight:700}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chk label{display:flex;align-items:center;gap:6px;background:#f1f5f9;padding:8px 12px;border-radius:999px;font-size:13px;color:var(--navy);font-weight:600;border:1px solid transparent}
.chk label:has(input:checked){background:#fff;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.15)}
.chk input{width:auto}
.chk label.off{opacity:.4;text-decoration:line-through}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1px solid var(--line);width:auto;padding:8px 14px;border-radius:999px;background:#fff;color:var(--navy);font-size:13px;margin:0;font-weight:650;box-shadow:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--gold)}
.plan{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:0 0 10px;font-size:14px;font-weight:750;width:100%;border:0;text-align:left}
.plan.on{background:#ecfdf3;color:var(--ok);border:1px solid #bbf7d0}
.plan.off{background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:0 0 10px}
.plan .flybox{width:20px;height:20px}
details{margin-top:6px}

.roost{margin-top:0}
.roost-wrap{background:linear-gradient(180deg,#0B1F3A,#143056);border-radius:14px;padding:10px 8px 12px;color:#fff;border:1px solid rgba(201,162,39,.25);overflow-x:auto;-webkit-overflow-scrolling:touch}
.roost-legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0 2px}
.roost-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:650;color:var(--gold-soft)}
.roost-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.roost-axis{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:end;margin-bottom:4px;min-width:320px}
.roost-axis .pad{font-size:9px;opacity:0}
.roost-hours{display:flex;justify-content:space-between;font-size:8px;font-weight:600;color:rgba(247,231,181,.75);font-variant-numeric:tabular-nums;padding:0 1px;letter-spacing:-.02em}
.roost-grid{display:flex;flex-direction:column;gap:5px;min-width:320px}
.roost-row{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start}
.roost-row .dn{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--gold-soft);text-align:center;padding-top:6px}
.roost-daystack{display:flex;flex-direction:column;gap:3px}
.roost-track{position:relative;height:22px;border-radius:4px;background:rgba(0,0,0,.28);overflow:hidden;border:1px solid rgba(255,255,255,.06);background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(12.5% - 1px),rgba(247,231,181,.14) calc(12.5% - 1px),rgba(247,231,181,.14) 12.5%)}
.roost-bar{position:absolute;top:2px;bottom:2px;border-radius:4px;min-width:2px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:8px;font-weight:800;color:#1a1208;padding:0 2px;white-space:nowrap;box-sizing:border-box;box-shadow:inset -2px 0 0 rgba(255,255,255,.95)}
.roost-bar.over{outline:1px solid #fecaca;opacity:.85}
.roost-empty{font-size:12px;color:rgba(247,231,181,.8);padding:10px 4px}
.roost-note{font-size:11px;color:var(--muted);margin-top:8px}

@media (max-width:420px){
.typekaart .grid4{grid-template-columns:1fr 1fr}
.grid4{gap:6px}
.grid4 label{font-size:11px}
.grid4 input{padding:8px 6px;font-size:15px}
}
</style>
</head>
<body>
<header><h1>Paxwise</h1></header>
<main>
<section>
<h2>Mijn routes</h2>
<div class="chips" id="chips"></div>
<div class="grid2">
<button type="button" class="ok" onclick="newRoute()">+ Nieuwe Route</button>
<button type="button" class="danger" onclick="deleteRoute()">− Route verwijderen</button>
</div>
<p class="autosave" id="autosaveHint">Wijzigingen worden automatisch opgeslagen.</p>
</section>
<section>
<h2>Route</h2>
<label class="lock"><input type="checkbox" id="lockRoute"> Vastzetten</label>
<div class="grid2">
<div><label>Heen</label><input class="yellow" id="fromA" maxlength="3" value="VIE" autocapitalize="characters"></div>
<div><label>Terug</label><input class="yellow" id="toA" maxlength="3" value="GRU" autocapitalize="characters"></div>
</div>
<p class="tiny" id="iataHint"></p>
<div class="grid2" style="margin-top:8px">
<div><label>Route</label><input class="yellow" id="route" value="VIE–GRU"></div>
<div><label>Afstand km (spel)</label><input class="yellow" id="km" type="number" value="10621"></div>
</div>
</section>
<section>
<details>
<summary class="h">Toestellen toevoegen / wijzigen</summary>
<label class="lock"><input type="checkbox" id="lockTypes"> Vastzetten</label>
<div id="types"></div>
<div class="typekaart" id="nieuwType">
<h3>Nieuw type</h3>
<div class="grid2">
<div><label>Naam</label><input id="nName" placeholder="bijv. 787-9"></div>
<div><label>Max pax</label><input id="nPax" type="number"></div>
</div>
<div class="grid4" style="margin-top:8px">
<div><label>Payload t</label><input id="nPay" type="number"></div>
<div><label>km/h</label><input id="nSpd" type="number"></div>
<div><label>Max km</label><input id="nRng" type="number"></div>
</div>
<button type="button" class="sec" id="btnAddType" onclick="addCustomType()">Voeg toestel toe</button>
</div>
</details>
</section>
<section>
<h2>Vraag per dag (pax)</h2>
<label class="lock"><input type="checkbox" id="lockAsk"> Vastzetten</label>
<div class="grid4 ask4">
<div><label>Economy</label><input class="yellow" id="qY" type="number" value="1788"></div>
<div><label>Business</label><input class="yellow" id="qJ" type="number" value="300"></div>
<div><label>First</label><input class="yellow" id="qF" type="number" value="96"></div>
<div><label>Cargo</label><div class="withunit"><input class="yellow" id="qC" type="number" step="1" value="21"><span class="unit">t</span></div></div>
</div>
<input id="factor" type="hidden" value="2">
<input id="jkost" type="hidden" value="1.8">
<input id="fkost" type="hidden" value="4.2">
</section>
<section>
<h2>Resterende vraag (pax)</h2>
<div class="rest" id="rest"></div>
</section>
<section>
<h2>Vlootinzet</h2>
<div class="chk" id="kiezen"></div>
<button type="button" onclick="suggest(false)">Stel vlootmix voor</button>
<button type="button" class="ghost" onclick="suggest(true)">Alleen de rest bijvullen</button>
<button type="button" class="danger" onclick="clearFleet()">Wis vloot</button>
</section>
<section>
<h2>Vloot</h2>
<div id="vloot"></div>
<button type="button" class="ghost" onclick="addKist()">+ lege retourvlucht</button>
</section>
<section class="roost">
<h2>Rooster</h2>
<div class="roost-wrap" id="roosterWrap">
<div class="roost-legend" id="roosterLegend"></div>
<div class="roost-axis"><span class="pad">·</span><div class="roost-hours"><span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div></div>
<div class="roost-grid" id="roosterGrid"></div>
</div>
<p class="roost-note" id="roosterNote"></p>
</section>
<section>
<h2>Waarom</h2>
<div class="advies" id="advies"></div>
</section>
</main>
<script>
const HUBS={VIE:[48.1103,16.5697],GRU:[-23.4319,-46.4678],GIG:[-22.8099,-43.2506],BSB:[-15.8711,-47.9186],AMS:[52.3086,4.7639],FRA:[50.0333,8.5706],MUC:[48.3538,11.7861],DUS:[51.2895,6.7668],HAM:[53.6304,9.9882],BER:[52.3667,13.5033],LHR:[51.47,-0.4543],LGW:[51.1537,-0.1821],MAN:[53.3537,-2.275],CDG:[49.0097,2.5478],ORY:[48.7233,2.3794],MAD:[40.4983,-3.5676],BCN:[41.2971,2.0785],FCO:[41.8003,12.2389],MXP:[45.6306,8.7281],ZRH:[47.4581,8.5481],GVA:[46.2381,6.1089],BRU:[50.9014,4.4844],DUB:[53.4213,-6.2701],CPH:[55.618,12.656],ARN:[59.6519,17.9186],OSL:[60.1939,11.1004],HEL:[60.3172,24.9633],WAW:[52.1658,20.9671],PRG:[50.1008,14.26],BUD:[47.4298,19.2611],ATH:[37.9364,23.9445],IST:[41.2753,28.7519],LIS:[38.7742,-9.1342],DXB:[25.2532,55.3657],DOH:[25.2731,51.6081],AUH:[24.433,54.6511],CAI:[30.1219,31.4056],JNB:[-26.1392,28.246],CPT:[-33.9648,18.6017],JFK:[40.6398,-73.7789],EWR:[40.6925,-74.1687],ORD:[41.9786,-87.9048],ATL:[33.6367,-84.4281],MIA:[25.7959,-80.287],DFW:[32.8968,-97.038],LAX:[33.9425,-118.408],SFO:[37.6189,-122.375],YYZ:[43.6772,-79.6306],MEX:[19.4363,-99.0721],EZE:[-34.8222,-58.5358],SCL:[-33.393,-70.7858],BOG:[4.7016,-74.1469],LIM:[-12.0219,-77.1143],NRT:[35.7647,140.386],HND:[35.5523,139.78],ICN:[37.4691,126.451],PEK:[40.0801,116.585],PVG:[31.1434,121.805],HKG:[22.308,113.919],SIN:[1.3502,103.994],BKK:[13.6811,100.747],DEL:[28.5562,77.1],BOM:[19.0887,72.8679],SYD:[-33.9461,151.177],MEL:[-37.6733,144.843],AKL:[-37.0082,174.792]};

const KEY="am_routes_v1", TKEY="am_types_v1";
let TYPE_ORDER=["A350-1000LR","A330-300","A320neo"];
let TYPE_DEFAULTS={
"A350-1000LR":{pax:480,payload:55,speed:950,range:18000},
"A330-300":{pax:440,payload:46,speed:871,range:11750},
"A320neo":{pax:195,payload:20,speed:893,range:6482}
};
let lastWhy=[], currentId=null;
function num(id){return parseFloat(document.getElementById(id).value)||0}
function nval(el){return parseFloat(el&&el.value)||0}
function sid(t,k){return k+"_"+t.replace(/[^A-Za-z0-9]/g,"")}
function code(id){return (document.getElementById(id).value||"").trim().toUpperCase()}
function loadTypes(){try{const s=JSON.parse(localStorage.getItem(TKEY)||"null");if(s&&s.order&&s.defs){TYPE_ORDER=s.order;TYPE_DEFAULTS=s.defs;const el=document.getElementById("lockTypes");if(el&&typeof s.lock!=="undefined")el.checked=!!s.lock}}catch(e){}}
function saveTypes(){try{const lock=document.getElementById("lockTypes");localStorage.setItem(TKEY,JSON.stringify({order:TYPE_ORDER,defs:TYPE_DEFAULTS,lock:lock?!!lock.checked:false}))}catch(e){}}
function setLocked(els,locked){els.forEach(el=>{if(!el)return;el.disabled=!!locked;if(el.tagName==="INPUT"&&el.type!=="checkbox"&&el.type!=="hidden"){el.classList.toggle("yellow",!locked)}})}
function applyRouteLock(){const locked=!!document.getElementById("lockRoute").checked;setLocked(["fromA","toA","route","km"].map(id=>document.getElementById(id)),locked)}
function applyAskLock(){const locked=!!document.getElementById("lockAsk").checked;setLocked(["qY","qJ","qF","qC"].map(id=>document.getElementById(id)),locked)}
function applyTypesLock(){
  const locked=!!document.getElementById("lockTypes").checked;
  TYPE_ORDER.forEach(t=>["pax","payload","speed","range"].forEach(k=>{const el=document.getElementById(sid(t,k));if(el){el.disabled=locked;el.classList.toggle("yellow",!locked)}}));
  ["nName","nPax","nPay","nSpd","nRng"].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=locked});
  const btn=document.getElementById("btnAddType");if(btn)btn.disabled=locked;
}
function applyKistLock(d){
  const on=d.querySelector(".flybox")?d.querySelector(".flybox").checked:true;
  d.querySelectorAll("input.y,input.j,input.f,input.c").forEach(el=>{el.disabled=on;el.classList.toggle("yellow",!on)});
  const sel=d.querySelector("select.type");if(sel)sel.disabled=on;
}
function gcdKm(a,b){const R=6371,to=d=>d*Math.PI/180,dlat=to(b[0]-a[0]),dlon=to(b[1]-a[1]),x=Math.sin(dlat/2)**2+Math.cos(to(a[0]))*Math.cos(to(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}
function applyIata(fillKm){
  const a=code("fromA"),b=code("toA");
  if(a.length===3&&b.length===3) document.getElementById("route").value=a+"–"+b;
  const ha=HUBS[a],hb=HUBS[b],hint=document.getElementById("iataHint");
  if(ha&&hb){const km=Math.round(gcdKm(ha,hb)); if(fillKm) document.getElementById("km").value=km; hint.textContent="IATA "+a+"↔"+b+" ≈ "+km+" km. Zet Playrion-km in het gele veld.";}
  else{if(fillKm&&a.length===3&&b.length===3) document.getElementById("km").value=""; hint.textContent="Onbekende code: typ de km uit het spel.";}
  calc();
}
function typeSpec(t){const d=TYPE_DEFAULTS[t]||{pax:0,payload:0,speed:0,range:0};return{pax:nval(document.getElementById(sid(t,"pax")))||d.pax,payload:nval(document.getElementById(sid(t,"payload")))||d.payload,speed:nval(document.getElementById(sid(t,"speed")))||d.speed,range:nval(document.getElementById(sid(t,"range")))||d.range}}
function rawVl(t){const km=num("km"),s=typeSpec(t).speed;return(!km||!s)?0:12*s/km}
function tooFar(t){const km=num("km");return km>0&&typeSpec(t).range+0.5<km}
function canFly(t){return num("km")>0&&!tooFar(t)}
function kwartierOmhoog(u){if(!(u>0))return 0;return Math.ceil(u*4-1e-9)/4}
function planVl(t){if(!canFly(t))return 0;const u=urenPerRetour(t);if(u>0){const n=Math.floor(24/u+1e-9);return n>=1?n:(24/u>=0.45?1:0)}const raw=rawVl(t);if(raw<0.45)return 0;if(raw<1)return 1;return Math.floor(raw)}
function blokU(t){const km=num("km"),s=typeSpec(t).speed;return(!km||!s)?0:km/s}
function selectedTypes(){return TYPE_ORDER.filter(t=>{const el=document.getElementById("use_"+t);return el&&el.checked&&!el.disabled&&canFly(t)&&planVl(t)>0}).sort((a,b)=>typeSpec(b).pax-typeSpec(a).pax)}
function packOne(need,typeName,jkost,fkost){
  const t=typeSpec(typeName),maxFl=planVl(typeName);if(!maxFl)return null;
  const pNeed=plek(need,jkost,fkost);
  const flPax=pNeed>0.5?Math.ceil(pNeed/t.pax-1e-9):0;
  const flC=(need.C>0.5&&t.payload>0)?Math.ceil(need.C/t.payload-1e-9):0;

  }
  let space=t.pax;
  const y=Math.min(Math.max(0,Math.ceil(need.Y/fl-1e-9)),space);space-=y;
  const j=Math.min(Math.max(0,Math.ceil(need.J/fl-1e-9)),Math.floor(space/jkost));space-=j*jkost;
  const f=Math.min(Math.max(0,Math.ceil(need.F/fl-1e-9)),Math.floor(space/fkost));

function plek(need,jk,fk){return Math.max(0,need.Y)+Math.max(0,need.J)*jk+Math.max(0,need.F)*fk}
function fillOf(p,jk,fk){const t=typeSpec(p.type);if(!t.pax)return 0;return ((+p.y)+(+p.j)*jk+(+p.f)*fk)/t.pax}
function worthExtraPlane(need,types,jk,fk){
  const p=plek(need,jk,fk);
  if(p<=0.5) return false;
  const small=typeSpec(types[types.length-1]).pax;
  if(p<small*0.5) return false;
  if(need.Y<=Math.max(1,small*0.12) && p<small*0.6) return false;

}
function pickType(need,types,jk,fk){
  const large=types[0], small=types[types.length-1];
  const p=plek(need,jk,fk);
  if(types.length===1) return large;
  if(need.F<0.5 && need.J<1 && p<=typeSpec(small).pax) return small;
  if(need.F*fk+need.J*jk > typeSpec(small).pax*0.55) return large;
  if(p<=typeSpec(small).pax) return small;
  const mid=types.find(t=>t!==large && t!==small) || small;
  if(p<=typeSpec(mid).pax) return mid;
  return large;
}
function restBits(need){
  const bits=[];

  if(need.J>0.5) bits.push(Math.ceil(need.J)+"J");
  if(need.F>0.5) bits.push(Math.ceil(need.F)+"F");
  if(need.C>0.5) bits.push(Math.ceil(need.C)+"t cargo");
  return bits.join(" / ");
}
function packNeed(need,types,jkost,fkost,already){
  already=already||0;
  const planes=[],why=[];need={...need};let guard=0;
  why.push("Doel: zo min mogelijk retourvluchten, zo vol mogelijk. Halve retourvluchten kosten geld.");
  while((need.Y>0.5||need.J>0.5||need.F>0.5||need.C>0.5)&&guard++<16){
    const prior=already+planes.length;
    const thin=prior>0 && !worthExtraPlane(need,types,jkost,fkost);
    const chosen=pickType(need,types,jkost,fkost);
    const p=packOne(need,chosen,jkost,fkost);if(!p)break;
    const fill=fillOf(p,jkost,fkost);

    p.warn=prior>0 && (thin || fill<0.5);
    const fl=+p.fl;
    planes.push(p);need.Y-=+p.y*fl;need.J-=+p.j*fl;need.F-=+p.f*fl;need.C-=+p.c*fl;
    let line=planes.length+". "+p.type+" · "+p.fl+"×/dag · "+p.y+"Y / "+p.j+"J / "+p.f+"F / "+p.c+"t · "+pct+"% vol";
    if(p.warn) line+=" — let op: door deze retourvlucht is de bezetting maar "+pct+"% (te leeg)";

  }

function clampKist(k,changed){
  const type=k.querySelector(".type").value;if(!type)return;
  const t=typeSpec(type),jk=num("jkost")||1.8,fk=num("fkost")||4.2;
  const yEl=k.querySelector(".y"),jEl=k.querySelector(".j"),fEl=k.querySelector(".f"),cEl=k.querySelector(".c");
  let y=Math.max(0,nval(yEl)),j=Math.max(0,nval(jEl)),f=Math.max(0,nval(fEl)),c=Math.max(0,nval(cEl));
  c=Math.max(0,Math.floor(c+1e-9));
  if(c>Math.floor(+t.payload||0)+1e-9) c=Math.max(0,Math.floor(+t.payload||0));
  cEl.value=c?String(c):"0";
  if(changed==="y"){
    const maxY=Math.max(0,Math.floor(t.pax-j*jk-f*fk+1e-9));
    if(y>maxY){y=maxY;yEl.value=y?String(y):"0"}
  }else if(changed==="j"){
    const maxJ=Math.max(0,Math.floor((t.pax-y-f*fk)/jk+1e-9));
    if(j>maxJ){j=maxJ;jEl.value=j?String(j):"0"}
  }else if(changed==="f"){
    const maxF=Math.max(0,Math.floor((t.pax-y-j*jk)/fk+1e-9));
    if(f>maxF){f=maxF;fEl.value=f?String(f):"0"}
  }else{
    let over=y+j*jk+f*fk-t.pax;
    if(over>0.05){
      const df=Math.min(f,Math.ceil(over/fk-1e-9));f-=df;over-=df*fk;
      if(over>0.05){const dj=Math.min(j,Math.ceil(over/jk-1e-9));j-=dj;over-=dj*jk}
      if(over>0.05){y=Math.max(0,Math.floor(y-over+1e-9))}
      yEl.value=y?String(y):"0";jEl.value=j?String(j):"0";fEl.value=f?String(f):"0";
    }
  }
  yEl.max=String(Math.max(0,Math.floor(t.pax)));
  jEl.max=String(Math.max(0,Math.floor(t.pax/jk)));
  fEl.max=String(Math.max(0,Math.floor(t.pax/fk)));
  cEl.max=String(Math.max(0,+t.payload||0));
}

function calc(){

      if(!flEl||flEl.value===""||flEl.value==null){fl=auto;if(flEl)flEl.value=String(auto)}
      else{fl=Math.min(nval(flEl)||auto,auto);if(flEl)flEl.value=String(fl)}
    }else{fl=fl||1;if(flEl&&(flEl.value===""||flEl.value==null))flEl.value=String(fl)}
    const info=k.querySelector("#info"+(idx+1));
    const warnEl=k.querySelector("#warn"+(idx+1));
    const wb=k.querySelector(".warnbox");
    const vliegt=k.querySelector(".flybox")?k.querySelector(".flybox").checked:true;
    if(!type){if(info){info.textContent="";info.className="tiny"};if(warnEl){warnEl.style.display="none";warnEl.textContent=""};return}
    const t=typeSpec(type),ruimte=y+j*jkost+f*fkost;
    if(info){info.className="tiny info-ok";info.textContent="Bezetting (pax) "+fmtBezet(ruimte)+"/"+t.pax}
    const fill=t.pax?(ruimte/t.pax):0;const pct=Math.round(fill*100);
    const thin=(wb&&wb.dataset.on==="1")||(fill>0&&fill<0.5);
    if(wb) wb.dataset.on=thin?"1":"0";
    let warnTxt="";
    if(!canFly(type)) warnTxt="Dit type is te ver voor deze route.";
    else if(ruimte>t.pax+0.05||c>t.payload+0.05) warnTxt="Deze mix is te vol voor max pax/payload.";
    else if(thin) warnTxt="Door deze retourvlucht is de bezetting maar "+pct+"% — te leeg.";
    if(warnEl){if(warnTxt){warnEl.style.display="block";warnEl.textContent=warnTxt}else{warnEl.style.display="none";warnEl.textContent=""}}
    if(!vliegt) return;
    weg.Y+=y*fl*fac;weg.J+=j*fl*fac;weg.F+=f*fl*fac;weg.C+=c*fl*fac;
  });
  const over={Y:num("qY")-weg.Y,J:num("qJ")-weg.J,F:num("qF")-weg.F,C:num("qC")-weg.C};
  const kind=v=>v>0.5?"left":(v<-0.5?"over":"zero");
  document.getElementById("rest").innerHTML=pill("Economy",over.Y.toFixed(0),kind(over.Y))+pill("Business",over.J.toFixed(0),kind(over.J))+pill("First",over.F.toFixed(0),kind(over.F))+pill("Cargo",over.C.toFixed(0)+" t",kind(over.C));
  document.getElementById("advies").innerHTML=lastWhy.concat(TYPE_ORDER.map(t=>!num("km")?(t+": —"):(tooFar(t)?(t+": te ver"):(t+": "+planVl(t)+"×/dag")))).map(t=>"<div>"+t+"</div>").join("");
  renderRooster();
  if(currentId) saveRoute(true);
}
try{
loadTypes();
renderTypes();
bindNums();
try{const ah=document.getElementById("autosaveHint");if(ah)setTimeout(()=>{ah.style.opacity="0";ah.style.transition="opacity .6s";setTimeout(()=>ah.remove(),700)},8000)}catch(e){}
["fromA","toA"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("input",()=>{el.value=el.value.toUpperCase();applyIata(true)})});
document.getElementById("km").addEventListener("input",calc);
document.getElementById("route").addEventListener("input",()=>{calc();if(currentId)saveRoute(false)});
document.querySelectorAll("input").forEach(el=>el.addEventListener("input",calc));
document.getElementById("lockRoute").addEventListener("change",()=>{applyRouteLock();saveRoute()});
document.getElementById("lockAsk").addEventListener("change",()=>{applyAskLock();saveRoute()});
document.getElementById("lockTypes").addEventListener("change",()=>{applyTypesLock();saveTypes()});
applyRouteLock();applyAskLock();applyTypesLock();
writeRows([{type:"A350-1000LR",fl:"1",y:"480",j:"0",f:"0",c:"0",on:true}]);
currentId="r-vie-gru";
try{saveRoute()}catch(e){}
applyIata(false);
}catch(e){document.getElementById("advies").textContent="Fout: "+e.message}
</script>
